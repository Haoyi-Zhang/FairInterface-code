name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded finite campaign and all contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          ulimit -v 2097152
          ulimit -t 240
          timeout --signal=TERM --kill-after=5s 40s \
            python -B tests/reachability_regression.py \
            > scientific-output/reachability.stdout.txt \
            2> scientific-output/reachability.stderr.txt
          timeout --signal=TERM --kill-after=5s 240s \
            python -B reproduce.py --output scientific-output/campaign \
            > scientific-output/controller.stdout.txt \
            2> scientific-output/controller.stderr.txt
      - name: Preserve raw output, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
